# 构建缓存放在 D:\app\Android\Gradle-Home，而不是默认的 C:\Users\<用户名>\.gradle。
# 这样这个工具链的所有痕迹都留在 D:\app\Android 下，卸载时删目录即可。
# 注意：GRADLE_USER_HOME 必须由 toolchain-env.bat 通过环境变量指定，写在 gradle.properties 里无效。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# 必须为 true：实时扫码用了 CameraX，而 CameraX 是 AndroidX 库。
#
# 早先这里是 false，配合"界面全部用框架自带控件"的做法，代价是扫码只能
# "调系统相机拍一张再解码"——要按快门、识别要等拍照完成。
# 改成实时预览后那条取舍不再成立：AndroidX 只出现在 :app 里，
# :protocol / :vban 仍是纯 Kotlin/JVM（由 scripts/check-layer-purity.py 把关）。
android.useAndroidX=true
# 没有用到任何 support 库（android.support.*），不需要 Jetifier 逐个改写。
android.enableJetifier=false

kotlin.code.style=official
