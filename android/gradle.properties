# 构建缓存放在 D:\app\Android\Gradle-Home，而不是默认的 C:\Users\<用户名>\.gradle。
# 这样这个工具链的所有痕迹都留在 D:\app\Android 下，卸载时删目录即可。
# 注意：GRADLE_USER_HOME 必须由 toolchain-env.bat 通过环境变量指定，写在 gradle.properties 里无效。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# 本应用刻意不使用 AndroidX：界面只用框架自带的 android.app.Activity 和基础控件，
# 这样依赖最少、构建最快，也不会因为新版 AndroidX 库要求更高的 compileSdk 而突然构建失败。
android.useAndroidX=false

kotlin.code.style=official
